<DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Produits</title>

<style>
body { margin:0; font-family:Arial; }

header {
 background:#2c3e50;
 color:white;
 display:flex;
 justify-content:space-between;
 padding:15px;
}

#bg {
 position: fixed;
 top:0;
 left:0;
 width:100%;
 height:100vh;
 background-size: cover;
 z-index:-1;
 opacity:0.35;
}

.slider {
 position: relative;
 display:flex;
 align-items:center;
 margin-top:260px;
}
.slider button {
 position: absolute;
 top: 50%;
 transform: translateY(-50%);
 background: rgba(0,0,0,0.6);
 color: white;
 border: none;
 font-size: 24px;
 padding: 10px 15px;
 border-radius: 50%;
 cursor: pointer;
 z-index: 10;
}

/* gauche */
.slider button:first-child {
 left: 10px;
}

/* droite */
.slider button:last-child {
 right: 10px;
}

/* effet hover */
.slider button:hover {
 background: rgba(0,0,0,0.8);
}

#familles {
 display: flex;
 gap: 10px;
 overflow: hidden; /* ? important */
 position: relative;
}

.fam {
 min-width: 140px; /* ? obligatoire */
 flex-shrink: 0;
}

.fam img {
 width:120px;
 height:120px;
 border-radius:10px;
}

#products {
 display:flex;
 gap:20px;
 padding:20px;
 flex-wrap:wrap;
}

/* ✅ taille image */
.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.3s;
}

/* ✅ zoom carte */
.card {
    transition: 0.3s;
}

/* ✅ effet hover (agrandissement article) */
.card:hover {
    transform: scale(1.08);
    z-index: 5;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ✅ zoom image interne */
.card:hover img {
    transform: scale(1.15);
}
#cartPanel {
 position: fixed;
 right: -320px;
 top: 0;
 width: 300px;
 height: 100%;
 background: white;
 transition: 0.3s;
 box-shadow: -3px 0 10px rgba(0,0,0,0.3);
}

#cartPanel.open {
 right: 0;
}
</style>

</head>

<body>

<header>
<h2>Nos Produits</h2>
<div class="cart-btn" onclick="toggleCart()">
    🛒 <span id="count">0</span>
</div>
</header>

<img id="bg" src="" alt="background">

<!-- SLIDER -->
<div class="slider">
<button onclick="scrollLeft()">&#9664;</button>  <!-- gauche -->

<div id="familles"></div>

<button onclick="scrollRight()">&#9654;</button> <!-- droite -->
</div>

<!-- PRODUITS -->
<div id="products"></div>

<!-- PANIER -->
<div id="cartPanel">
<div id="checkoutForm" style="display:none; background:#eee; padding:10px; margin-top:10px;">

 <h4>Infos client</h4>

 <input id="nom" placeholder="Nom" style="width:100%; margin:5px;"><br>
 <input id="prenom" placeholder="Prénom" style="width:100%; margin:5px;"><br>
 <input id="adresse" placeholder="Adresse" style="width:100%; margin:5px;"><br>

 <p>Livraison : 2 €</p>

 <button onclick="sendOrder()">Valider</button>

</div>

<h3>Panier</h3>
<ul id="cartItems"></ul>
<p id="total">Total : 0 €</p>
<button onclick="showCheckout()">Acheter</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
 emailjs.init("bNw2AknrF3390_d6H");
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
if(typeof emailjs === "undefined"){
 console.log("EmailJS non chargé");
}
// ? vider panier UNE seule fois au premier lancement
if (!sessionStorage.getItem("initCartDone")) {
    localStorage.setItem("cart", JSON.stringify([]));
    sessionStorage.setItem("initCartDone", "true");
}
// ===== DATA =====
const familles = [
 {nom:"Solaire", img:"https://www.maparatunisie.tn/wp-content/uploads/2026/04/la-roche-posay-anthelios-uvmune-400-fluide-anti-taches-spf-50-sans-parfum-50ml.jpg"},
 {nom:"Visage", img:"https://i.imgur.com/YQnEZTk.jpeg"},
 {nom:"Corps", img:"https://i.imgur.com/i3mQHvy.jpeg"},
 {nom:"Huile", img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgHjKKIQ3MYbNWu4Da8HhtwnDLiqnMciK6pAXEap4nA7Fjbxl5n60zmZL05f1Z5L4zovhszRD1Fe2cTPNmb4Tp8m2o-q9BHHklfn7IsOWUSo2pfKd-DrUeZEDv2NjZXV6xXASj9dwIk5dIA8qxXBngYFQt92qWY8W7Fbxl2qey80Bu5RzxOCHzhvP5g/s16000/avis-avene-protections-solaires-notino-coups-de-coeur-de-mumu.jpeg"},
 {nom:"Sèrom", img:"https://i.imgur.com/uL3HKIC.jpeg"},
 {nom:"Ortho", img:"https://i.imgur.com/IIwhcLd.jpeg"}
];

const produits = {
 Solaire:[{nom:"SPF50",prix:20,remise:10,stock:10}],
 Visage:[{nom:"Crème",prix:30,remise:5,stock:5}],
 Corps:[{nom:"Lotion",prix:15,remise:0,stock:8}],
 Huile:[{nom:"Huile",prix:20,remise:10,stock:10}],
 Sèrom:[{nom:"Sèrom",prix:35,remise:5,stock:5}],
 Ortho:[{nom:"Lotion",prix:25,remise:0,stock:8}],
};

// ===== AFFICHAGE FAMILLES =====
const famDiv = document.getElementById("familles");
let position = 0;
let auto;

// largeur 1 �l�ment
function getWidth(){
  const item = document.querySelector(".fam");
  return item ? item.offsetWidth + 10 : 150;
}

// AUTO SLIDER (comme index ?)
function startAuto(){
  auto = setInterval(() => {

    position += 1;

    famDiv.style.transform = "translateX(-" + position + "px)";

    // boucle infinie
    if(position >= famDiv.scrollWidth / 2){
      position = 0;
    }

  }, 20);
}

// pause hover
famDiv.addEventListener("mouseenter", () => clearInterval(auto));
famDiv.addEventListener("mouseleave", startAuto);

// d�marrage
startAuto();


// ===== AFFICHAGE FAMILLES =====
// ? DUPLIQUER pour effet infini
familles.forEach(f => {
 let div = document.createElement("div");
 div.className = "fam";

 let img = document.createElement("img");
 img.src = f.img;

 let p = document.createElement("p");
 p.innerText = f.nom;

 div.appendChild(img);
 div.appendChild(p);

 div.onclick = () => loadFam(f.nom, f.img);

 famDiv.appendChild(div);
});

// ===== LOAD FAMILLE =====
window.loadFam = function(name, img){
 document.getElementById("bg").src = img; 
 let container = document.getElementById("products"); 
 container.innerHTML = ""; 

 produits[name].forEach(p =>{
  let final = p.prix - (p.prix * p.remise / 100); 

  container.innerHTML += ` 
  <div class="card">

  <img src="${img}" alt="produit">

  <h3>${p.nom}</h3> 
  Prix: ${p.prix} €<br> 
  Remise: ${p.remise}%<br> 
  Final: ${final.toFixed(2)} €<br> 
  Stock: ${p.stock}<br> 

  <button onclick="addCart('${p.nom}', ${final})">Ajouter</button> 

  </div>`;
 }); 
}


// ===== SLIDER =====
// contr�le du slider
window.scrollLeft = () => {
  position -= 150;
  if (position < 0) position = 0;
  famDiv.style.transform = "translateX(-" + position + "px)";
};

window.scrollRight = () => {
  const max = famDiv.scrollWidth - famDiv.clientWidth;

  position += 150;
  if (position > max) position = max;

  famDiv.style.transform = "translateX(-" + position + "px)";
};
// ===== PANIER =====
function getCart(){
  return JSON.parse(localStorage.getItem("cart")) || []; 
}
function saveCart(c){ localStorage.setItem("cart", JSON.stringify(c)); }

// ? FIX ADD CART
window.addCart = function(nom, prix){
    let cart = getCart();

    let item = cart.find(i=>i.nom === nom);

    if(item){
        item.qte++;
    } else {
        cart.push({nom:nom, prix:prix, qte:1});
    }

    saveCart(cart);
    updateCart();

    console.log("Panier:", cart); // debug ?
}

// ===== UPDATE =====
function updateCart(){
    let cart = getCart();

    let list = document.getElementById("cartItems");
    list.innerHTML = "";

    let total=0, count=0;

    cart.forEach((it,i)=>{
        let sub = it.prix * it.qte;
        total += sub;
        count += it.qte;

        list.innerHTML += `
        <li>
            ${it.nom}
            <button onclick="qty(${i},-1)">-</button>
            ${it.qte}
            <button onclick="qty(${i},1)">+</button>
            = ${sub.toFixed(2)} €
            <button onclick="del(${i})">X</button>
        </li>`;
    });

    document.getElementById("total").innerText = "Total : " + total.toFixed(2) + " €";
    document.getElementById("count").innerText = count;
}

// ===== ACTIONS =====
window.qty = function(i,d){
    let c = getCart();
    c[i].qte += d;
    if(c[i].qte <= 0) c.splice(i,1);
    saveCart(c);
    updateCart();
}

window.del = function(i){
    let c = getCart();
    c.splice(i,1);
    saveCart(c);
    updateCart();
}
window.clearCart = function(){
 localStorage.setItem("cart", JSON.stringify([]));
 updateCart();
}
// ===== PANEL =====
window.toggleCart = function(){
    document.getElementById("cartPanel").classList.toggle("open");
}
window.showCheckout = function(){
 document.getElementById("checkoutForm").style.display = "block";
}
function generateOrderNumber() {
    let today = new Date();

    let dd = String(today.getDate()).padStart(2, '0');
    let mm = String(today.getMonth() + 1).padStart(2, '0');
    let yy = String(today.getFullYear()).slice(-2);

    let datePart = dd + mm + yy; // ex: 140526

    // récupérer dernier compteur
    let lastDate = localStorage.getItem("orderDate");
    let counter = localStorage.getItem("orderCount");

    if (lastDate === datePart) {
        counter = parseInt(counter || "0") + 1;
    } else {
        counter = 1;
    }

    // sauvegarde
    localStorage.setItem("orderDate", datePart);
    localStorage.setItem("orderCount", counter);

    let countStr = String(counter).padStart(3, '0');

    return datePart + "-" + countStr; // ex: 140526-001
}

window.sendOrder = function(){

 if(typeof emailjs === "undefined"){
  alert("EmailJS non chargé ?");
  return;
 }

 let nom = document.getElementById("nom").value;
 let prenom = document.getElementById("prenom").value;
 let adresse = document.getElementById("adresse").value;

 if(!nom || !prenom || !adresse){
  alert("Remplir tous les champs !");
  return;
 }

 let cart = getCart();
 let orderId = generateOrderNumber(); // ✅ NEW

 let total = 0;
 let message = "Commande N°: " + orderId + "\n\n";

 cart.forEach(it=>{
  let sub = it.prix * it.qte;
  total += sub;
  message += it.nom + " x" + it.qte + " = " + sub + " €\n";
 });

 let livraison = 7;
 total += livraison;

 message += "\nLivraison: " + livraison + " €";
 message += "\nTOTAL: " + total + " €\n\n";

 message += "Client:\n" + nom + " " + prenom + "\n" + adresse;

 emailjs.send("service_mntu679", "template_ck3fxdg", {
    message: message,
    order_id: orderId // ✅ tu peux aussi l’utiliser dans EmailJS
 })
 .then(function(response) {
  alert("✅ EMAIL ENVOYE !");
 })
 .catch(function(error) {
  alert("❌ ERREUR EMAIL");
  console.log(error);
 });

}

// INIT
updateCart();

});
</script>

</body>
</html>
